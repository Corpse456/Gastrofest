services:
    postgres:
        image: postgres:16.4
        container_name: gastrofest_postgresql
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: gastrofest
            POSTGRES_PASSWORD: gastrofest
            POSTGRES_DB: gastrofest
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./db:/docker-entrypoint-initdb.d:ro
    frontend:
        build:
            context: ../Frontend
            dockerfile: Dockerfile
        container_name: gastrofest_frontend
        ports:
            - "5173:5173"
        volumes:
            - ../Frontend:/usr/src/app
            - /usr/src/app/node_modules
volumes:
    postgres_data:
